<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // var n1 = 100; // 초기화
        var n1 = prompt("첫 번째 값 입력");
        var n2 = prompt("두 번째 값 입력");
        var n3 = Number(n1) + Number(n2); // 변수가 숫자가 아닌 문자로 받아들이기 때문에 여기서 사용된 +는 연결연산자로 사용된다.
        
        // 변수로 입력받은 숫자가 문자열이 아닌 숫자로 바꿔주는 역할은 "Number() 숫자 타입으로 변환하는 내장함수]"를 사용한다.
        // prompt : 

        // console.log(n1);
        // console.log("변수 n2에 입력한 값은 "+ n2 +"입니다.");
        console.log("n1 + n2 = " + n3);
    </script>
</body>
</html>
