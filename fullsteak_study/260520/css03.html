<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .flex-item {
            width: 80px;
            height: 80px;
            background-color: orange;
            box-sizing: border-box;
            border: 1px solid cyan;
        }
    </style>
</head>
<body>
    <!-- Flexbox(CSS3) -->
     <!-- flexbox는 뷰포트나 요소의 크기가 불명확하거나 동적으로 변할 떄에도 효율적으로 HTML 요소를 배치, 정렬, 분산ㅁ할 수 있는 방법을 제공하는 CSS의 새로운 레이아웃 방식 -->

     <div class="container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
        <div class="flex-item">5</div>
     </div>
</body>
</html>
