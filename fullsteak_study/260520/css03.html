<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap; /* flex-wrap : flex 아이템들이 한 줄에 다 안 들어갈 때 어떻게 처리할지 정하는 속성 (nowrap(default) | wrap) */
            flex-direction: row; /* flex-direction : 주축 방향.(row(default) | column) */
            justify-content: space-around;
            align-items: center;
            background-color: aquamarine;
            height: 100vh; 
            /* 높이는 뷰포트의 높이만큼 늘리기 
                (vh : viewport Height | vw : viewport Width) */
        }

        /* justify-content(가로축 정렬) */
        /* center : 중앙 | end : 우측 
        space-between : 양 끝 아이템을 부모 박스의 양쪽 끝에 붙이고, 
        아이템 사이 공간만 균등하게 나눔
        space-around : 각 아이템의 양 옆에 여백을 줘서 배치 */

        /* align-items(세로축 정렬) */
        /* flex-start : 위쪽 정렬 | center : 가운데 정렬 
        flex-end : 아래쪽 정렬 | baseline : 글자의 기준선(baseline) 맞춤 */

        /* center와 baseline의 차이점 */
        /* center는 박스 기준 가운데 정렬 기능이며, 
            baseline은 글자 줄 기준 가운데 정렬 기능임 */

        /* gap : flex나 grid에서 요소 사이 간격을 만드는 속성, 
            margin-right 하나하나 안줘도 되서 실무에서 많이 사용함 
            gap : (세로) (가로); */

        .flex-item {
            width: 80px;
            height: 80px;
            background-color: orange;
            box-sizing: border-box;
            border: 1px solid cyan;
        }
    </style>
</head>
<body>
    <!-- Flexbox(CSS3) -->
     <!-- flexbox는 뷰포트나 요소의 크기가 불명확하거나 동적으로 변할 떄에도 효율적으로 HTML 요소를 배치, 정렬, 분산ㅁ할 수 있는 방법을 제공하는 CSS의 새로운 레이아웃 방식 -->

     <div class="container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
        <div class="flex-item">5</div>
     </div>
</body>
</html>
