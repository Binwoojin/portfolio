<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var name = prompt("이름을 입력하세요.");

        // 브라우저 출력
        document.write("<h1>" + name + "님 환영합니다!</h1>");
        // 알람창(alert) 출력
        alert("<h1>" + name + "님 환영합니다!</h1>");
        // 콘솔 출력
        console.log(name + "님 환영합니다!");
    </script>
</body>
</html>
