<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a; // 변수 a를 선언
        a = 10; // 변수 a는 10이라는 값을 할당한다.

        // 출력방법 (1. 브라우저 출력 | 2. 콘솔 출력)

        // 브라우저 출력 방법
        document.write("a 변수의 값 = "+ a +"<br>");


        // 변수 b를 선언한 후 100의 값을 할당하여 브라우저로 출력
       var b;
       b = 100;
       document.write("b 변수의 값 = "+ b +"<br>");
        // 콘솔 출력
    </script>
</body>
</html>
