<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적표</title>
</head>
<body>
    <h2>학생 성적표</h2>
    <!-- table>(tr>th*5)+(tr>td*5)*4 -->
    <table border="1" width="400px">
        <tr style="background-color: rgba(54, 119, 255, 0.5);">
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
            <th>비고</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>90</td>
            <td>80</td>
            <td>60</td>
            <td rowspan="4"></td>
        </tr>
        <tr>
            <td>둘리</td>
            <td>85</td>
            <td>65</td>
            <td>90</td>
        </tr>
        <tr>
            <td>김철수</td>
            <td>95</td>
            <td>60</td>
            <td>60</td>
        </tr>
        <tr>
            <td>뽀로로</td>
            <td>100</td>
            <td>20</td>
            <td>20</td>
        </tr>
    </table>
</body>
</html>
