<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 심화 - 속성선택자</title>
    <style>
        /* a태그 중에서 target 이라는 속성이 존하하는 요소만 선택 */
        a[target] {
            background-color: pink;
        }

        /* href 속성에서 값 중 kakao 라는 단어가 들어있는 요소만 선택 */
        a[href*="kakao"] {
            background-color: purple;
        }

        /* href 속성의 값 중에서 ".net"으로 끝나는 요소만 선택 */
        a[href$=".net"] {
            /* 이탤릭체 : 기울어져 있는 글자체 */
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="http://www.naver.com">네이버</a>
    <a href="http://www.naver.com" target="_blank" rel="noopener noreferrer">네이버</a>
</body>
</html>
