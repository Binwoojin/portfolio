<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee behavior="alternate" scrollamount="20">
        This is a scrolling text!
    </marquee>

    <!-- marquee 태그는 HTML에서 텍스트나 이미지를 좌우 또는 상하로 
     움직이는 효과를 주는 태그입니다.
    behavior 속성은 움직이는 방식(예: scroll, slide, alternate)을 
    지정하고  scrollamount 속성은 움직이는 속도를 설정합니다.
    위 예시에서는 behavior="alternate"로 설정하여 텍스트가 좌우로 
    움직이도록 하고, scrollamount="20"으로 설정하여 텍스트가 
    빠르게 움직이도록 했습니다. -->
</body>
</html>
