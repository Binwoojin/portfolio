<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: lightblue;
            width: 100px;
            height: 100px;
        }

        #blueDiv {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div>점심시간</div>
    <!-- div 태그는 블록 레벨 요소입니다.
    블록 레벨 요소는 기본적으로 줄바꿈이 발생하며, 전체 너비를 차지합니다. -->

    <div id="blueDiv">RED</div>
</body>
</html>
