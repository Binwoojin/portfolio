<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-size: 20px;
        }

        #bbb {
            font-weight: bold;
            background-color: pink;
        }

        #ccc {
            color: orange;
        }

        #ddd {
            color: skyblue;
        }

        /* 식별자 선택자 : HTML 요소에 고유한 식별자를 부여하여 스타일을 적용하는 방법
        예를 들어, #main-title {color: blue;}는 id가 "main-title"인 요소의 
        텍스트 색상을 파란색으로 설정하는 CSS 규칙입니다.
        식별자 선택자는 HTML 요소에 고유한 스타일을 적용할 때 유용하지만, 
        동일한 id를 여러 요소에 사용할 수 없으므로 주의해서 사용해야 합니다.
        식별자 선택자는 특정 요소에만 스타일을 적용할 때 효과적이며, 
        다른 요소에는 영향을 주지 않습니다. 따라서, 식별자 선택자를 사용할 때는 
        HTML 문서 내에서 고유한 id 값을 사용하여 스타일을 적용하는 것이 중요합니다. */


    </style>
</head>
<body>
    <h1 id="main-title">ID 선택자</h1>

    <p>HTML의 모든 요소는 선택자로 사용 가능</p>
    <p id="bbb">HTML의 모든 요소는 선택자로 사용 가능</p>
    <p id="ccc">HTML의 모든 요소는 선택자로 사용 가능</p>
    <p id="ddd">HTML의 모든 요소는 선택자로 사용 가능</p>

</body>
</html>
