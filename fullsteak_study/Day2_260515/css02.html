<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/css02.css">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, "궁서체", sans-serif;
        }

        /* * : 모든 요소를 선택하는 범용 선택자입니다. 예를 들어, * {margin: 0;}은 
        모든 요소의 여백을 0으로 설정하는 CSS 규칙입니다. 
        범용 선택자는 모든 요소에 공통된 스타일을 적용할 때 유용하지만, 
        성능에 영향을 줄 수 있으므로 주의해서 사용해야 합니다. 
        범용 선택자는 모든 요소에 스타일을 적용하기 때문에, 특정 요소에만 
        스타일을 적용하려면 다른 선택자와 함께 사용하거나, 범용 선택자 대신 
        다른 선택자를 사용하는 것이 좋습니다.  */

        p {
            background-color: green;
            color:white;
        }

        h1 {
            color: red;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>type 선택자</h1>

    <p style="background-color: pink; color: black;">HTML의 모든 요소는 선택자로 사용 가능</p>
    <p>HTML의 모든 요소는 선택자로 사용 가능</p>
    <p>HTML의 모든 요소는 선택자로 사용 가능</p>
    <p>HTML의 모든 요소는 선택자로 사용 가능</p>
    <p>HTML의 모든 요소는 선택자로 사용 가능</p>
    


    <!-- type 선택자 : HTML 요소의 이름을 선택자로 사용하여 스타일을 적용하는 방법입니다.
    예를 들어, p {color: blue;}는 모든 p 요소의 텍스트 색상을 파란색으로 설정하는 
    CSS 규칙입니다. type 선택자는 가장 기본적인 선택자 중 하나이며, 
    HTML 요소의 기본 스타일을 정의할 때 자주 사용됩니다. 
    type 선택자를 사용하면 특정 HTML 요소에 일관된 스타일을 적용할 수 있습니다. -->
</body>
</html>
