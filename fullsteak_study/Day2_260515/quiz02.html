<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈2</title>
    <style>
        .box {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 5px solid blue;
            margin: 0 auto;
            box-sizing: border-box; /* 요소의 전체 크기를 width와 height로 계산하도록 설정 */
            background-color: red;
        }

        .box2 {
            background-color: pink;
            border: 3px solid green;
        }
        button {
            background-color: greenyellow;
            border: 1px solid red;
            border-radius: 10px 20px 30px 40px;
             /* border-radius 속성은 요소의 테두리를 둥글게 만드는 CSS 속성입니다. */
        }


    </style>
</head>
<body>
    <div class="box">이것은 박스입니다</div>
    <div class="box2"></div>

    <button>버튼</button>
</body>
</html>
