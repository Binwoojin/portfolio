<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #aaa, #bbb {
            color: red;
        }

        .bluep {
            color: blue;
        }

        ul {
            width: 35%;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;

        }

        .pinkcolor {
            color: pink;
        }
    </style>
</head>
<body>
    <h1>선택자</h1>

    <p id="aaa">HTML의 모든 요소는 선택자</p>
    <p id="bbb">HTML의 모든 요소는 선택자</p>
    <p class="bluep">HTML의 모든 요소는 선택자</p>
    <p class="bluep">HTML의 모든 요소는 선택자</p>

    <ul>
        <li>상품1</li>
        <li class="pinkcolor">상품2</li>
        <li>상품3</li>
        <li class="pinkcolor">상품4</li>
        <li class="pinkcolor">상품5</li>
    </ul>
</body>
</html>
