<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업메모(260519)</title>
    <style>
        /* 그룹 선택자 */
        h1, p {
            /* 글자 중앙 정렬 */
            text-align: center;
        }
        /* 자손 선택자 */
        div > p {
            background-color: pink;
        }

        /* 강백호만 글자를 붉은색 : p + span - p태그 뒤에 인접한 형제 span 하나 */
        div > p + span {
            color: red;
        }

        div > p ~ span {
            color: lightgreen;
        }

        /* 네이버 링크에 마우스를 올려놓으면 배경을 초록색으로 변경 */
        a[href='http://www.naver.com']:hover {
            background-color: green;
        }

        /* 의사클래스 (seudo class) 
            :hover - 마우스 포인터가 요소 위에 올라가 있으면 선택
            :active - 사용자가 활성화된 요소를 나타낸다
            :visited - 한 번이라도 방문한 적이 있는 링크를 나타낸다
            :link - 아직 방문하지 않은 요소를 나타낸다
            :focus - 입력양신 칸에 포커스를 받은 요소 
        */

        /* 입력창에 포커스가 가면 배경색을 핑크색, 테두리를 빨강색 보더값 1px */
        input[type="text"]:focus {
            background-color: pink;
            border: none;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <h1>스마트폰 판매현황</h1>
    <p>분기별 자료</p>
    <div>
        <p>루피</p>
        <p>크롱</p>
        <div>
            <p>하츄핑</p>
            <span>강백호</span>
            <span>서장훈</span>
        </div>
    </div>
    <div>
        뽀로로
    </div>

    <a href="http://www.naver.com">네이버</a>
    <div id="test">버튼</div>
    <p>아래 입력창을 클릭하거나 tab키로 포커스를 이동하세요</p>
    <input type="text" name="" id="" placeholder="여기에 입력">
    <p>
        hello world
    </p>

    <button class="btn">클릭</button>
</body>
</html>
