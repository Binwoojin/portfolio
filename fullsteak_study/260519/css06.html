<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 400px;
            height: 200px;
            border-radius: 8px;
            color: red;
            font-size: 20px;
            /* background-color: yellow; */
            background: linear-gradient(90deg,rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
        }

        .box2 {
            width: 400px;
            height: 200px;
            border-radius: 8px;
            color: red;
            font-size: 20px;
            background: radial-gradient(circle,rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
        }

        .box3 {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            color: #333;
            font-size: 20px;
            background: linear-gradient(-90deg,rgba(234, 238, 174, 1) 0%, rgba(233, 148, 217, 1) 100%);
        }
    </style>
</head>
<body>
    <div class="box">배경</div>
    <div class="box2">배경</div>
    <div class="box3">배경</div>
</body>
</html>
