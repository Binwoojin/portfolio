<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .circle {
            width: 20px;
            height: 20px;
            background-color: blue;
            border-radius: 50%;
            position: absolute;
            animation: moveCircle 1s infinite;
        }

        .circle:nth-child(2) {
            left: 30px;
            animation-delay: .2s;
        }

        .circle:nth-child(3) {
            left: 60px;
            animation-delay: .3s;
        }

        .circle:nth-child(4) {
            left: 90px;
            animation-delay: .4s;
        }
        .circle:nth-child(5) {
            left: 120px;
            animation-delay: .5s;
        }

        .circle:last-child {
            left: 150px;
            animation-delay: .6s;
        }

        @keyframes moveCircle {
            0% {
                background-color: red;
                transform: scale(0.5);
            } 50% {
                background-color: blue;
                transform: translateY(50px) scale(1);
            } 100% {
                background-color: red;
                transform: scale(0.5);
            }
        }
    </style>
</head>
<body>
    <div class="animation-wrapper">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
