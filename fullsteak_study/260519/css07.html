<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        img {
            width: 150px;
        }

        /* Transform 속성 */

        .img1:hover {
            transform: translate(50px, 50px); /* x, y, (z) */
            /* transform: translateY(50px); */
            /* X축 방향으로 50px 만큼 이동 */
        }

        .img2:hover {
            transform: scale(2,2);
            /* transform: scaleX(2); */
            /* transform: scaleY(2); */
            /* scaleX(n) : n배만큼 x축 방향으로 커짐 | scaleY(n) : n배만큼 y축 방향으로 커짐 */
        }


        .img3:hover {
            /* transform: rotateX(180deg); */
            /* transform: rotateY(180deg); */
            transform: rotateZ(180deg);
            /* rotateX(n(deg)) : x축 방향으로 n도 각도만큼 회전 | rotateY(n(deg)) : y축 방향으로 n도 각도만큼 회전 | rotateZ(n(deg)) : z축 방향으로 n도 각도만큼 회전 */
            /* +deg : 시계 방향 | -deg : 반시계 방향 */
        }

        .img4:hover {
            transform: skewX(45deg);
            /* skewX(n(deg)) : x축 방향으로 n도 각도만큼 왜곡 | skewY(n(deg)) : y축 방향으로 n도 각도만큼 왜곡 */
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="img1" src="document (1).jpeg" alt="">
    </div>

    <div class="box">
        <img class="img2" src="document (1).jpeg" alt="">
    </div>

    <div class="box">
        <img class="img3" src="document (1).jpeg" alt="">
    </div>

    <div class="box">
        <img class="img4" src="document (1).jpeg" alt="">
    </div>
</body>
</html>
