<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        img {
            width: 150px;
        }

        /* Transform 속성 */

        .img1:hover {
            transform: translate(50px, 50px); /* x, y, (z) */
            /* transform: translateY(50px); */
            /* X축 방향으로 50px 만큼 이동 */
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="img1" src="document (1).jpeg" alt="">
    </div>
</body>
</html>
