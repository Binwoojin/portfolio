<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업메모(260519)</title>
    <style>
        /* 그룹 선택자 */
        h1, p {
            /* 글자 중앙 정렬 */
            text-align: center;
        }
        /* 자식 선택자 */
        div > p {
            font-weight: bold;            
        }

        /* 자손 선택자 */
        div p {
            background-color: pink;
        }

        /* 강백호만 글자를 붉은색 : p + span - p태그 뒤에 인접한 형제 span 하나 */
        div > p + span {
            color: red;
        }

        div > p ~ span {
            color: lightgreen;
        }

        /* 네이버 링크에 마우스를 올려놓으면 배경을 초록색으로 변경 */
        a[href='http://www.naver.com']:hover {
            background-color: green;
        }

        /* 의사클래스 (seudo class) 
            :hover - 마우스 포인터가 요소 위에 올라가 있으면 선택
            :active - 사용자가 활성화된 요소를 나타낸다
            :visited - 한 번이라도 방문한 적이 있는 링크를 나타낸다
            :link - 아직 방문하지 않은 요소를 나타낸다
            :focus - 입력양신 칸에 포커스를 받은 요소 
        */

        /* id가 test인 요소는 너비가 30px, 높이가 30px 배경 초록색 */
        #test {
            width: 30px;
            height: 30px;
            background-color: green;
        }

        /* id가 test인 요소에 마우스가 올라가면 배경이 red로 변경 */
        #test:hover {
            background-color: red;
        }

        /* 입력창에 포커스가 가면 배경색을 핑크색, 텍스트 색상을 빨강색 */
        input:focus {
            background-color: pink;
            color: red;
        }

        /* pseudo element : 해당 HTML 요소의 특정 부분만 선택할 떄 사용
           양식 - 선택자::의사요소이름 { 속성: 값; }

           ::first-line - 텍스트의 첫 라인만 선택 (block 레벨 요소에서만 사용 가능)
           ::before - 특정 요소의 내용 부분 바로 앞에 다른 요소를 삽입할 떄 사용
        
        */

        p::first-line {
            color: blue;
            text-transform: uppercase;
        }

        .btn::before {
            content: "⭐️";
            color: silver;
            font-size: 20px;
        }

        /* CSS 적용 우선순위
            !important > 인라인 스타일 > ID 선택자 > 클래스 선택자 > 태그 선택자
            !important : 가장 최우선순위로 설정
        */
    </style>
</head>
<body>
    <h1>스마트폰 판매현황</h1>
    <p>분기별 자료</p>
    <div>
        <p>루피</p>
        <p>크롱</p>
        <div>
            <p>하츄핑</p>
            <span>강백호</span>
            <span>서장훈</span>
        </div>
    </div>
    <div>
        뽀로로
    </div>

    <a href="http://www.naver.com">네이버</a>
    <div id="test">버튼</div>
    <p>아래 입력창을 클릭하거나 tab키로 포커스를 이동하세요</p>
    <input type="text" name="" id="" placeholder="여기에 입력">
    <p>
        hello world
    </p>

    <button class="btn">클릭</button>
</body>
</html>
