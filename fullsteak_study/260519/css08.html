<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        img {
            width: 150px;
        }

        .img1 {
            transition-property: width, height;
            transition-duration: 2s;
            transition-delay: 1s;
            /* transition-timing-function: linear; */
            transition-timing-function: ease-in;
        }

        .img1:hover {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="img1" src="document (1).jpeg" alt="">
    </div>
</body>
</html>
