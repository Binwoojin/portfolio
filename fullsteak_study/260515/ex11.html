<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="next.html">
        <label for="name">이름</label>
        <input type="text" name="name" id="name"><br>

        <label for="desc">자기소개</label>
        <textarea name="desc" id="desc" rows="10" cols="50"></textarea><br>

        <input type="button" value="클릭">
        <input type="submit" value="전송">

        <!-- submit 버튼은 폼의 데이터를 서버로 전송하는 역할을 합니다. 
         버튼을 클릭하면 폼에 입력된 데이터가 action 속성에 지정된 URL로 
         전송됩니다. 
         반면, button 요소는 기본적으로 아무런 동작도 하지 않으며, 
         자바스크립트를 사용하여 원하는 동작을 구현할 수 있습니다. 따라서 
         submit 버튼은 폼 데이터를 전송하는 데 사용되고, 
         button 요소는 다양한 용도로 사용할 수 있습니다. -->

         
    </form>
</body>
</html>
