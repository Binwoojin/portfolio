<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시멘틱 태그 사용하기</title>
</head>
<body>
    <header>
        <h1>웹 개발</h1>
        <nav>
            <ul>
                <li><a href="#html">HTML</a></li>
                <li><a href="#css">CSS</a></li>
                <li><a href="#js">JavaScript</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <article>
                <h2 id="html">HTML</h2>
                <p>HTML은 웹 페이지의 구조를 정의하는 마크업 언어입니다.</p>
            </article>
            <article>
                <h2 id="css">CSS</h2>
                <p>CSS는 웹 페이지의 디자인과 레이아웃을 정의하는 스타일 시트 언어입니다.</p>
            </article>
            <article>
                <h2 id="js">JavaScript</h2>
                <p>JavaScript는 웹 페이지에 동적 기능을 추가하는 프로그래밍 언어입니다.</p>
            </article>
        </section>
        <aside>
            <p>팁 : 항상 시멘틱&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;태그를 사용하면 유지보수가 편리합니다</p>
            &lt;html&gt; 태그를 사용해요
        </aside>
    </main>

    <footer>
        <p>&copy; 2026</p>
        <!-- HTML 엔티티 : HTML의 특수문자 코드로, 웹 페이지에서 특수문자를
        올바르게 표시하기 위해 사용됩니다. 예를 들어, &lt;는 <로, 
        &gt;는 >로, &nbsp;는 공백, &amp;는 &로 표시됩니다. HTML 엔티티를 사용하면 
        특수문자가 HTML 코드로 인식되는 것을 방지할 수 있습니다.   -->
    </footer>
</body>
</html>
