<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페 메뉴판</title>
    <style>
        h1 {
            text-align: center;
            color:brown;
            margin-bottom: 30px;
        }
        .title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 50px;
        }

        .menu {
            width: 80%;
            margin: 0 auto;
            background-color: #efefef;
            border: 1px solid #666666;

        }

        .menu1, .menu2, .menu3 {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .menu1 p:first-child, .menu2 p:first-child, .menu3 p:first-child {
            font-size: 36px;
            font-weight: bold;
            color: brown;
            letter-spacing: -1px;
        }

        .menu1 p:last-child, .menu2 p:last-child, .menu3 p:last-child {
            font-size: 16px;
            color: #666666;
            text-align: right;
        }

        button {
            padding: 20px;
            border: 1px solid rgb(136, 68, 12);
            background-color: transparent;
            display: block;
            margin: 50px auto;
        }

        button:hover {
            background-color: rgb(136,68,12);
            color: white;
            border: none;
        }

    </style>
</head>
<body>
    <h1>MINTI CAFE</h1>
    <p class="title">따뜻한 커피와 디저트를 판매합니다</p>

    <div class="menu">
        <div class="menu1">
            <p>아메리카노</p>
            <p>2,000원</p>
        </div>
        <div class="menu2">
            <p>카페라떼</p>
            <p>3,000원</p>
        </div>
        <div class="menu3">
            <p>치즈케이크</p>
            <p>4,500원</p>
        </div>
    </div>

    <button>주문하기</button>

    
</body>
</html>
