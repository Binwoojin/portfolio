<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width:230px;
            height: 250px;
            background-color: orange;
        }

        #div1 {
            /* margin: 20px 30px 50px 20px; /* top, right, bottom, left */
            margin: 0 auto; /* 수평 중앙 정렬 */
            padding: 20px;
            border: 1px solid black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="div1">
        ID : <input type="text" name="id" id="id"><br>
        PW : <input type="password" name="pw" id="pw">
    </div>

    <!-- margin : 요소의 바깥 여백을 설정하는 CSS 속성입니다.
    padding : 요소의 안쪽 여백을 설정하는 CSS 속성입니다.
    border : 요소의 테두리를 설정하는 CSS 속성입니다. -->
    <div id="div2"></div>
</body>
</html>
